services:
  # Backend API
  - type: web
    name: inventory-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # ML Service
  - type: web
    name: inventory-ml-service
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd ml-service && pip install -r requirements.txt
    startCommand: cd ml-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    
  # Frontend
  - type: web
    name: inventory-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

# Database
databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: free
    region: oregon
